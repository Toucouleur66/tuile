[package]
name = "tuile-viewer"
description = "The interactive globe viewer as a library: window, camera, controls, steering and scripting, generic over where terrain and imagery come from"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
# `sync` for the gate a paused session's loads wait on, `time` for the
# bounded flush of the tile store on the way out.
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tuile-atmosphere = { version = "0.8.1", path = "../tuile-atmosphere" }
tuile-camera = { version = "0.8.1", path = "../tuile-camera" }
tuile-core = { version = "0.8.1", path = "../tuile-core" }
tuile-planetary = { version = "0.8.1", path = "../tuile-planetary" }
tuile-storage-foyer = { version = "0.8.1", path = "../tuile-storage-foyer" }
tuile-tape = { version = "0.8.1", path = "../tuile-tape" }
# Ctrl-C, SIGTERM and SIGHUP have to end the *session*, not the process: a
# recording is most valuable in exactly the run that ends badly. A safe wrapper
# rather than raw `libc::signal`, because the workspace denies `unsafe_code`.
ctrlc = { version = "3.5", features = ["termination"] }
# The Prometheus bridge. It lives in its own crate rather than here because
# nothing about publishing the engine's counters is specific to a wgpu window:
# the headless probes and the warm-up job want exactly the same endpoint.
tuile-metrics = { version = "0.8.1", path = "../tuile-metrics" }
tuile-terrain = { version = "0.8.1", path = "../tuile-terrain" }
tuile-ui = { version = "0.8.1", path = "../tuile-ui" }
tuile-wgpu = { version = "0.8.1", path = "../tuile-wgpu" }
wgpu = { workspace = true }
web-time = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
futures-executor = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }

# The menu-bar readout is a desktop's: a phone has no menu bar, and the crates
# behind it do not build there.
[target.'cfg(not(target_os = "ios"))'.dependencies]
tuile-ui = { version = "0.8.1", path = "../tuile-ui", features = ["statusbar"] }

# A process started from an icon gets 256 file descriptors; the tile store
# alone wants more. The established safe wrapper over `setrlimit`, since the
# workspace denies `unsafe_code`.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

# The operating system's location service, for `--here` and the `L` key.
# macOS and iOS, and only this example: no library crate knows where the
# machine is. Without the feature, or on another platform, the flag and the key
# answer "not available" and the viewer runs as it always did.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSDate", "NSDictionary", "NSError", "NSRunLoop", "NSScriptCommand", "NSScriptCommandDescription", "NSString", "NSValue"] }
# The alert shown when there is no terminal, and the clipboard.
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSAlert", "NSApplication", "NSPasteboard", "NSResponder", "NSRunningApplication"] }
# The menu bar. The menu crate this workspace already locks, through the
# status-bar readout of `tuile-ui`; nothing is added to the dependency graph.
muda = { version = "0.19", optional = true }
objc2-core-location = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

# The phone: the same location service, plus what a handset asks of the
# system and a desktop never needs to — how much memory the process may still
# take, how hot the device is running, a message shown over the window, the
# clipboard. The same bindings as the desktop's, from the same release train.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSError", "NSProcessInfo", "NSRunLoop", "NSString", "NSUserDefaults", "NSValue"] }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIAlertController", "UIApplication", "UIColor", "UIFont", "UIGeometry", "UILabel", "UIPasteboard", "UIResponder", "UIView", "UIViewController", "UIWindow"] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-location = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

[features]
default = ["current-location", "application"]
current-location = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-core-location"]
# What makes the viewer an application on its desktop: steering URLs from
# other programs, a message window when there is no terminal, the clipboard.
# On a phone: the message over the window, the clipboard, and the device's
# memory and temperature. macOS and iOS; elsewhere it compiles to nothing.
application = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:muda", "dep:objc2-ui-kit", "dep:objc2-core-foundation"]
