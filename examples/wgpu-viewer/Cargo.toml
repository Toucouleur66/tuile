[package]
name = "tuile-wgpu-viewer"
description = "Demo viewer for tuile: the tuile-viewer application over the public connectors"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# The application is `tuile-viewer`. What is left here is the one decision a
# host makes: where terrain and imagery come from. This binary answers with the
# public connectors; another host answers with its own and reuses the rest.
[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tuile-bing = { version = "0.8.1", path = "../../crates/tuile-bing" }
tuile-cesium-ion = { version = "0.8.1", path = "../../crates/tuile-cesium-ion" }
tuile-native-fetchers = { version = "0.8.1", path = "../../crates/tuile-native-fetchers" }
tuile-viewer = { version = "0.8.1", path = "../../crates/tuile-viewer" }

# Android: the catalog proxy's address, read and checked as a URL.
[target.'cfg(target_os = "android")'.dependencies]
url = { workspace = true }
