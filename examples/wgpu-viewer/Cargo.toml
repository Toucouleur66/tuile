[package]
name = "tuile-wgpu-viewer"
description = "Demo viewer for tuile: the tuile-viewer application over the public connectors"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# The application is `tuile-viewer`. What is left here is the one decision a
# host makes: where terrain and imagery come from. This binary answers with the
# public connectors; another host answers with its own and reuses the rest.
[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tuile-bing = { version = "0.8.5", path = "../../crates/tuile-bing" }
tuile-cesium-ion = { version = "0.8.5", path = "../../crates/tuile-cesium-ion" }
tuile-native-fetchers = { version = "0.8.5", path = "../../crates/tuile-native-fetchers" }
tuile-viewer = { version = "0.8.5", path = "../../crates/tuile-viewer" }
# The catalog proxy's address, read and checked as a URL: Android's, and a
# headless run's.
url = { workspace = true }

# The headless runs (`tests/headless.rs`): this host's application, driven
# through its control API over the real catalog — through a catalog proxy
# served in the test process, which alone holds the token.
[dev-dependencies]
axum = "0.8"
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }
tuile-camera = { version = "0.8.4", path = "../../crates/tuile-camera" }
tuile-cesium-ion = { version = "0.8.4", path = "../../crates/tuile-cesium-ion", features = ["proxy"] }
tuile-core = { version = "0.8.4", path = "../../crates/tuile-core" }
tuile-tape = { version = "0.8.4", path = "../../crates/tuile-tape" }
tuile-viewer = { version = "0.8.4", path = "../../crates/tuile-viewer", features = ["control"] }
