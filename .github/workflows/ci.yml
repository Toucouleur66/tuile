name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The tray icon and the native menu are GTK on Linux, so every job that
      # builds the viewer needs the development headers. See `tuile-ui`.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Software Vulkan rasterizer so the headless wgpu render tests run on
      # Linux CI, and the GTK headers the tray icon and native menu need.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo test --workspace

  # The graphics budget's simulation and properties, in release: the
  # scenarios are too slow unoptimised (they are ignored in debug builds),
  # and the properties run at 10 000 cases here. The golden decision digests
  # are checked on Linux as on the Mac that recorded them.
  budget-sim:
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p tuile-core --test budget_sim --test budget_properties --test budget_core --test budget_imagery

  wasm-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every crate that claims wasm, not only the core. `tuile-web` is
      # entirely gated on wasm32, so no native build ever compiled it: it
      # stopped building in August and nothing said so until October.
      # `-D warnings` because a warning only seen on wasm is seen by nobody.
      - name: cargo check (wasm32, -D warnings)
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p tuile-core
          -p tuile-web
          -p tuile-wgpu
          -p tuile-planetary
          -p tuile-terrain
          -p tuile-camera
          -p tuile-atmosphere
          -p tuile-film-gpu
          -p tuile-ui
          -p tuile-film
      # The viewer's web shell, its transport and its renderer, as the
      # browser builds them: no native build ever compiles that code.
      - run: cargo clippy --target wasm32-unknown-unknown -p tuile-viewer -p tuile-web -p tuile-wgpu -- -D warnings

  # The package a page imports: the wasm build and its bindings, the
  # typings checked by tsc, and a bundler that ships the worker and the wasm.
  web-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen at the locked version
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: packages/tuile-viewer/build.sh --dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: examples/web-viewer-vite
        run: |
          npm install --no-audit --no-fund
          npm run build

  # The Android shell, as the device builds it: no host build ever compiles
  # that code. Clippy on the target, then the APK through the same script a
  # developer runs — the runner image carries the SDK and the NDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cargo install cargo-ndk --locked
      - name: cargo clippy (aarch64-linux-android, -D warnings)
        run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 26
          clippy -p tuile-viewer -p tuile-wgpu-viewer -- -D warnings
      - name: the APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" crates/tuile-viewer/android/build.sh

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo doc --workspace --no-deps
