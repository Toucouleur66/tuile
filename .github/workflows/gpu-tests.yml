#
# The tests tagged `#[ignore = "slow: ..."]`: the normal runs skip them, this
# one runs them on demand (Actions > gpu-tests > Run workflow). No schedule.
# The slow tests that render, through lavapipe (Mesa software Vulkan), as the
# `test` job of ci.yml does; the others are `slow-tests.yml`. Their
# filterset is derived from the source (scripts/slow-tests-filter.sh).
name: gpu-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    runs-on: tuile-linux
    env:
      TUILE_REQUIRE_GPU: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-host
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo nextest run --profile slow --run-ignored only --workspace -E "$(scripts/slow-tests-filter.sh gpu)"
