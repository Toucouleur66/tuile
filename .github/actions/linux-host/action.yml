name: Linux host packages
description: >-
  On a self-hosted Linux runner (tuile-linux), installs what the GitHub-hosted
  Ubuntu image already carries and the workspace needs to build: a C
  toolchain and linker, pkg-config, cmake, the ALSA and Wayland headers, and
  lavapipe. On a GitHub-hosted runner, or in the prebuilt CI image
  (TUILE_CI_IMAGE=1, which has all of it), it does nothing.
runs:
  using: composite
  steps:
    # The runner pod is the stock actions-runner image (Ubuntu 24.04, noble):
    # git, curl and sudo, nothing to compile with. The same noble archive as
    # the hosted ubuntu-24.04 image, so lavapipe is the same Mesa.
    - if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        # The prebuilt CI image (integrations/docker/Dockerfile.ci) has all of this.
        if [ "${TUILE_CI_IMAGE:-}" = 1 ]; then echo "CI image: host packages already installed"; exit 0; fi
        # The stock runner image lists the git-core PPA, which the runner's
        # network policy does not allow: `apt-get update` waited for its
        # connections to time out on every job. Nothing here comes from it.
        sudo rm -f /etc/apt/sources.list.d/git-core-ubuntu-ppa*.list \
          /etc/apt/sources.list.d/git-core-ubuntu-ppa*.sources
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential pkg-config cmake zstd xz-utils \
          libasound2-dev libwayland-dev libxkbcommon-dev \
          mesa-vulkan-drivers libvulkan1
    # sccache, the shared compile cache, on a self-hosted runner only, and only
    # when the runner pod was given the whole of it (bucket, region, key id and
    # secret — the TUILE_SCCACHE_* of scripts/test-on-builder.sh): anything
    # missing, nothing changes. Same install and same conventions as the
    # builder (integrations/docker/sccache-{install,env}.sh); the key prefix is
    # the runner's own, `gha-<arch>-gnu`, so CI and the builder never share an
    # entry. A fork pull request never reaches here: it runs on a hosted runner.
    - if: runner.environment == 'self-hosted' && github.event.pull_request.head.repo.fork != true
      shell: bash
      run: |
        if [ -z "${TUILE_SCCACHE_BUCKET:-}" ] || [ -z "${TUILE_SCCACHE_KEY_ID:-}" ] \
            || [ -z "${TUILE_SCCACHE_SECRET:-}" ]; then
          echo "sccache: off (TUILE_SCCACHE_BUCKET / _KEY_ID / _SECRET not all set), compiling without it"
          exit 0
        fi
        command -v sccache > /dev/null || sudo sh "${GITHUB_WORKSPACE}/integrations/docker/sccache-install.sh"
        command -v sccache > /dev/null || { echo "sccache: not installed, compiling without it"; exit 0; }
        echo "::add-mask::${TUILE_SCCACHE_KEY_ID}"
        echo "::add-mask::${TUILE_SCCACHE_SECRET}"
        prefix="${TUILE_SCCACHE_PREFIX:-gha-$(uname -m)-gnu}"
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_BUCKET=${TUILE_SCCACHE_BUCKET}"
          echo "SCCACHE_S3_KEY_PREFIX=${prefix}"
          echo "AWS_ACCESS_KEY_ID=${TUILE_SCCACHE_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY=${TUILE_SCCACHE_SECRET}"
          [ -z "${TUILE_SCCACHE_REGION:-}" ] || echo "SCCACHE_REGION=${TUILE_SCCACHE_REGION}"
          [ -z "${TUILE_SCCACHE_ENDPOINT:-}" ] || echo "SCCACHE_ENDPOINT=${TUILE_SCCACHE_ENDPOINT}"
        } >> "${GITHUB_ENV}"
        echo "sccache: on, s3://${TUILE_SCCACHE_BUCKET}/${prefix}"
